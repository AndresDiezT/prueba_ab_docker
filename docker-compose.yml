services:
  migrate:
    build:
      context: ${BACKEND_CONTEXT}
    container_name: ab_comercial_migrate
    env_file:
      - ${BACKEND_ENV_FILE}
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: ${BACKEND_CONTEXT}
    container_name: ab_comercial_api
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    build:
      context: ${BACKEND_CONTEXT}
    container_name: ab_comercial_seed
    profiles:
      - tools
    env_file:
      - ${BACKEND_ENV_FILE}
    command: ["python", "-m", "scripts.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ${FRONTEND_CONTEXT}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ab_comercial_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
